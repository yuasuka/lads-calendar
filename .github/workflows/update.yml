name: Update PV links
on:
  schedule:
    - cron: "30 3 * * *"     # 每 6 小時一次（UTC）
  workflow_dispatch:           # 也可在 Actions 頁面手動執行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch YouTube and update pools.json
        run: python scripts/update_pv.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # 沒設定就自動改用 RSS
      - name: Commit if changed
        run: |
          if ! git diff --quiet pools.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pools.json
            git commit -m "auto: update pools.json"
            git push
          fi
