<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戀與深空 卡池年曆</title>
<style>
:root{
  --bg:#fbf9fe;--card:#fff;--ink:#4a4458;--sub:#7a7391;--line:#ece6f6;--accent:#7b5ea7;--today:#ff5c8a;
  --n-混池:#c9b6f2;--n-月卡:#a8d1f7;--n-日卡:#b5e3bf;--n-生日:#ffe08a;--n-自選:#d3d8dc;
  --r-混池:#e7defa;--r-月卡:#d6e8fb;--r-日卡:#daf2e0;--r-生日:#fff0c6;--r-自選:#edeff1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;font-size:14px}
header{padding:14px 18px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:20px;margin:0;color:var(--accent);flex:1 1 auto}
.today-badge{background:#fff;border:2px solid var(--today);color:var(--today);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 18px}
button,select,input{font:inherit;color:var(--ink)}
button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{background:#f3eefc}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}
.title{font-size:18px;font-weight:700;min-width:120px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 18px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;border:1px solid transparent;user-select:none}
.chip.off{opacity:.35;text-decoration:line-through}
.chip.ghost{background:#fff;border:1px dashed var(--sub);color:var(--sub)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:6px 18px 24px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:4px 0}
.dow div:first-child,.dow div:last-child{color:#a06a8e}
.cell{min-height:92px;border:1px solid var(--line);margin:-0.5px;padding:3px;background:#fff;cursor:pointer;position:relative;overflow:hidden}
.cell.out{background:#fbf9fe;opacity:.55}
.cell.sel{outline:2px solid var(--accent);z-index:1}
.cell.today{box-shadow:inset 0 0 0 2px var(--today);background:#fff5f8}
.dn{font-size:12px;font-weight:700;color:var(--sub)}
.cell.today .dn{color:var(--today)}
.ev{display:block;font-size:11px;line-height:1.25;border-radius:5px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ev.re{font-style:normal}
.ev.pred{border:1.5px dashed #8d86a3;background:#fff !important}
.ev.pv{background:#ffe3ea !important;color:#b3294f;font-weight:700}
.ev.pv,a.pvl{text-decoration:none}
a.pvl{color:#b3294f;font-weight:700}a.pvl:hover{text-decoration:underline}
a.ev.pv{cursor:pointer}
.more{font-size:10px;color:var(--sub);margin-top:2px}
@media(max-width:640px){.cell{min-height:58px}.ev{font-size:0;height:7px;padding:0;border-radius:4px}.ev.pv{height:7px}.more{font-size:9px}}
.side h3{margin:0 0 6px;font-size:14px;color:var(--accent)}
.side section{margin-bottom:14px}
.item{display:flex;gap:6px;align-items:flex-start;margin:5px 0;font-size:13px;line-height:1.35}
.sw{flex:0 0 12px;height:12px;border-radius:4px;margin-top:3px}
.sw.pred{border:1.5px dashed #8d86a3;background:#fff}
.muted{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-left:4px;background:#f1ecfa;color:var(--accent)}
.tag.live{background:#ffe3ea;color:#b3294f}
.tag.pvok{background:#e3f6ea;color:#2e8b57}
.tag.pred{background:#fff;border:1px dashed var(--sub);color:var(--sub)}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mini{border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:#fff}
.mini h4{margin:0 0 4px;font-size:13px;text-align:center}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.md{aspect-ratio:1;font-size:9px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:var(--ink);position:relative}
.md.today{outline:2px solid var(--today);z-index:1}
.md.pv::after{content:"";position:absolute;right:1px;top:1px;width:4px;height:4px;border-radius:50%;background:#e53935}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;position:sticky;top:0;background:#fff}
tr.cur td{background:#fff5f8}
dialog{border:1px solid var(--line);border-radius:14px;max-width:420px;width:92%}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--sub)}
dialog input,dialog select{width:100%;padding:5px;border:1px solid var(--line);border-radius:8px}
footer{padding:0 18px 20px;color:var(--sub);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>戀與深空　卡池年曆</h1>
  <span class="today-badge" id="todayBadge"></span>
</header>

<div class="bar">
  <button id="prev" aria-label="上一個">◀</button>
  <span class="title" id="title"></span>
  <button id="next" aria-label="下一個">▶</button>
  <button id="goToday">回到今天</button>
  <span class="seg" id="views">
    <button data-v="month" class="on">月</button><button data-v="year">年</button><button data-v="list">清單</button>
  </span>
  <button id="addBtn">＋ 新增／補 PV</button>
  <button id="reload">重新載入資料</button>
  <button id="pick">選取 pools.json</button><input type="file" id="file" accept=".json,application/json" hidden>
</div>
<div class="filters" id="filters"></div>

<div class="layout">
  <main class="card" id="main"></main>
  <aside class="card side" id="side"></aside>
</div>

<footer id="foot"></footer>

<dialog id="dlg">
  <form method="dialog" id="form">
    <b>新增卡池／補 PV（只存在這個瀏覽器）</b>
    <label>卡池名稱</label><input name="name" required>
    <label>類型</label>
    <select name="kind"><option>混池</option><option>月卡</option><option>日卡</option><option>生日</option><option>自選</option></select>
    <label>角色（混池可留空）</label><input name="chars">
    <label><input type="checkbox" name="rerun" style="width:auto"> 復刻</label>
    <label>開池日</label><input type="date" name="start" required>
    <label>截止日</label><input type="date" name="end" required>
    <label>PV 首播日（選填）</label><input type="date" name="pv">
    <label>PV 時間（選填，如 20:00）</label><input name="pvTime">
    <label><input type="checkbox" name="pred" style="width:auto"> 這是預測</label>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button type="button" id="exportBtn">匯出我新增的 JSON</button>
      <button type="button" id="cancel">取消</button>
      <button id="save" value="ok" class="on">儲存</button>
    </div>
  </form>
</dialog>

  var a=el("a",cls||"pvl",txt);a.href=pvHref(p);a.target="_blank";a.rel="noopener noreferrer";
  a.title=p.pvUrl?"開啟官方 PV（YouTube）":"到官方頻道搜尋「"+p.name+"」";
  a.onclick=function(e){e.stopPropagation()};return a;
}
function pvItem(prefix,p,txt){var d=el("div","item");d.appendChild(document.createTextNode(prefix));d.appendChild(pvLink(txt,p));return d}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function renderFilters(){
  var f=document.getElementById("filters");f.textContent="";
  KINDS.forEach(function(k){
    var c=el("span","chip"+(state.kinds[k]?"":" off"),NAME[k]);c.style.background="var(--n-"+k+")";
    c.onclick=function(){state.kinds[k]=!state.kinds[k];render()};f.appendChild(c)});
  [["新卡","新卡"],["復刻","↻復刻"],["預測","預測"]].forEach(function(x){
    var c=el("span","chip ghost"+(state.show[x[0]]?"":" off"),x[1]);
    c.onclick=function(){state.show[x[0]]=!state.show[x[0]];render()};f.appendChild(c)});
  var tip=el("span","muted","　▶＝PV 首播日（點擊開啟 YouTube；🔍＝尚無影片連結，改為搜尋官方頻道）　粉框＝今天　虛線＝預測");f.appendChild(tip);
}

function renderMonth(list){
  var main=document.getElementById("main");main.textContent="";
  var dow=el("div","dow");WD.forEach(function(w){dow.appendChild(el("div",null,w))});main.appendChild(dow);
  var g=el("div","grid");main.appendChild(g);
  var first=new Date(state.y,state.m,1);var start=new Date(first);start.setDate(1-first.getDay());
  var rows=Math.ceil((first.getDay()+new Date(state.y,state.m+1,0).getDate())/7);
  for(var i=0;i<rows*7;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);var s=ymd(d);
    var c=el("div","cell"+(d.getMonth()!==state.m?" out":"")+(s===T?" today":"")+(s===state.sel?" sel":""));
    c.appendChild(el("div","dn",String(d.getDate())));
    var act=onDay(list,s),pvs=pvOn(list,s);
    pvs.slice(0,1).forEach(function(p){var e=pvLink((p.pvUrl?"▶ PV ":"▶ PV 🔍")+p.name,p,"ev pv");e.title=(p.pvUrl?"開啟官方 PV：":"到官方頻道搜尋：")+p.name+(p.pvTime?"（首播 "+p.pvTime+"）":"");c.appendChild(e)});
    var room=3-Math.min(pvs.length,1);
    act.slice(0,room).forEach(function(p){
      var e=el("span","ev"+(p.pred?" pred":""),label(p));e.style.background=bg(p);e.title=p.name+"　"+md(p.start)+"–"+md(p.end);c.appendChild(e)});
    if(act.length>room) c.appendChild(el("div","more","+"+(act.length-room)));
    (function(s){c.onclick=function(){state.sel=s;render()}})(s);
    g.appendChild(c);
  }
}

function renderYear(list){
  var main=document.getElementById("main");main.textContent="";
  var yr=el("div","year");main.appendChild(yr);
  for(var m=0;m<12;m++){
    var box=el("div","mini");box.appendChild(el("h4",null,(m+1)+" 月"));
    var g=el("div","mg");
    var first=new Date(state.y,m,1);
    for(var k=0;k<first.getDay();k++) g.appendChild(el("div","md"));
    var n=new Date(state.y,m+1,0).getDate();
    for(var d=1;d<=n;d++){
      var s=state.y+"-"+pad(m+1)+"-"+pad(d);var act=onDay(list,s);
      var c=el("div","md"+(s===T?" today":"")+(pvOn(list,s).length?" pv":""),String(d));
      if(act.length){c.style.background=bg(act[0]);if(act[0].pred)c.style.outline="1px dashed #8d86a3"}
      g.appendChild(c)}
    box.appendChild(g);
    (function(m){box.onclick=function(){state.m=m;state.view="month";render()}})(m);
    yr.appendChild(box)}
}

function renderList(list){
  var main=document.getElementById("main");main.textContent="";
  var yl=list.filter(function(p){return p.start.slice(0,4)==String(state.y)||p.end.slice(0,4)==String(state.y)})
    .sort(function(a,b){return a.start.localeCompare(b.start)||a.rerun-b.rerun});
  var t=el("table");var h=el("tr");["開池","截止","卡池","類型","角色","PV 首播","狀態"].forEach(function(x){h.appendChild(el("th",null,x))});t.appendChild(h);
  yl.forEach(function(p){
    var r=el("tr",(T>=p.start&&T<=p.end&&!p.pred)?"cur":"");
    var nm=el("td");var sw=el("span","sw"+(p.pred?" pred":""));sw.style.display="inline-block";sw.style.marginRight="4px";sw.style.background=p.pred?"#fff":bg(p);nm.appendChild(sw);nm.appendChild(document.createTextNode((p.rerun?"↻ ":"")+p.name+(p.pending?"（待確認）":"")));
    var st=status(p),pv=pvStatus(p);
    [md(p.start),md(p.end)].forEach(function(x){r.appendChild(el("td",null,x))});r.appendChild(nm);
    r.appendChild(el("td",null,NAME[p.kind]));r.appendChild(el("td",null,p.chars||"—"));
    var pvTd=el("td");
    if(p.pv){pvTd.appendChild(pvLink((p.pvUrl?"▶ ":"🔍 ")+md(p.pv)+(p.pvTime?" "+p.pvTime:""),p))}
    else if(!p.pred){pvTd.appendChild(pvLink("🔍 搜尋",p))}
    else pvTd.appendChild(document.createTextNode("—"));
    r.appendChild(pvTd);
    var s=el("td");s.appendChild(el("span","tag "+st.c,st.t));r.appendChild(s);t.appendChild(r)});
  main.appendChild(t);
}

function item(p,extra){
  var d=el("div","item");var sw=el("span","sw"+(p.pred?" pred":""));if(!p.pred)sw.style.background=bg(p);d.appendChild(sw);
  var b=el("div");var st=status(p);
  var l=el("div");l.appendChild(el("b",null,(p.rerun?"↻ ":"")+p.name));l.appendChild(el("span","tag",NAME[p.kind]));if(p.pending)l.appendChild(el("span","tag pred","待確認"));
  var pvs=pvStatus(p);if(pvs)l.appendChild(el("span","tag "+pvs.c,pvs.t));
  b.appendChild(l);
  b.appendChild(el("div","muted",(p.chars?p.chars+"　":"")+md(p.start)+"–"+md(p.end)+"　"+st.t+(p.pv?"　PV "+md(p.pv)+(p.pvTime?" "+p.pvTime:""):"")));
  if(extra&&p.extra){var x=el("button",null,"刪除");x.onclick=function(){var a=extras().filter(function(e){return e.id!==p.id});saveExtras(a);render()};b.appendChild(x)}
  d.appendChild(b);return d;
}

function renderSide(list){
  var s=document.getElementById("side");s.textContent="";
  var all=allPools();
  var sec=el("section");sec.appendChild(el("h3",null,"今天　"+fmtFull(T)));
  var now=onDay(all.filter(function(p){return !p.pred}),T);
  if(!now.length) sec.appendChild(el("div","muted","目前沒有限定五星池"));
  now.forEach(function(p){sec.appendChild(item(p))});
  var pvt=pvOn(all,T);pvt.forEach(function(p){sec.appendChild(pvItem("▶ 今天首播：",p,p.name+" PV"))});
  s.appendChild(sec);

  var up=all.filter(function(p){return p.start>T}).sort(function(a,b){return a.start.localeCompare(b.start)}).slice(0,4);
  var sec2=el("section");sec2.appendChild(el("h3",null,"接下來"));
  if(!up.length) sec2.appendChild(el("div","muted","資料中沒有後續排期"));
  up.forEach(function(p){sec2.appendChild(item(p))});s.appendChild(sec2);

  var pvl=all.filter(function(p){return p.pv}).sort(function(a,b){return b.pv.localeCompare(a.pv)});
  var pub=pvl.filter(function(p){return p.pv<=T}).slice(0,3),sch=pvl.filter(function(p){return p.pv>T}).reverse();
  var sec3=el("section");sec3.appendChild(el("h3",null,"PV 動態"));
  sch.forEach(function(p){sec3.appendChild(pvItem("⏳ "+md(p.pv)+" 預定　",p,p.name))});
  pub.forEach(function(p){sec3.appendChild(pvItem("▶ "+md(p.pv)+(p.pvTime?" "+p.pvTime:"")+"　",p,p.name+(p.rerun?"（復刻）":"")))});
  s.appendChild(sec3);

  var sec4=el("section");sec4.appendChild(el("h3",null,"選取日　"+fmtFull(state.sel)));
  var sel=onDay(all,state.sel);if(!sel.length)sec4.appendChild(el("div","muted","這天沒有限定五星池"));
  sel.forEach(function(p){sec4.appendChild(item(p,true))});
  pvOn(all,state.sel).forEach(function(p){sec4.appendChild(pvItem("▶ PV 首播"+(p.pvTime?" "+p.pvTime:"")+"：",p,p.name))});
  s.appendChild(sec4);
}

function render(){
  T=todayStr();
  var b=document.getElementById("todayBadge");b.textContent="今天 "+fmtFull(T);
  var list=visible();
  var title=document.getElementById("title");
  title.textContent=state.view==="month"?state.y+" 年 "+(state.m+1)+" 月":state.y+" 年";
  Array.prototype.forEach.call(document.querySelectorAll("#views button"),function(x){x.classList.toggle("on",x.dataset.v===state.view)});
  renderFilters();
  if(state.view==="month")renderMonth(list);else if(state.view==="year")renderYear(list);else renderList(list);
  renderSide(list);
  document.getElementById("foot").textContent=
    "資料來源："+state.source+"（資料更新日 "+state.updated+"）。日期慣例：開池日 05:00 更新後～截止日 04:59。▶ 只標示已查證的 PV 首播日；預測依歷史間隔推算，非官方排期，預測開池日一過或官方資料出現同類池即自動隱藏。";
}

/* ============ 導覽 ============ */
function step(n){
  if(state.view==="month"){var d=new Date(state.y,state.m+n,1);state.y=d.getFullYear();state.m=d.getMonth()}
  else state.y+=n;
  render();
}
document.getElementById("prev").onclick=function(){step(-1)};
document.getElementById("next").onclick=function(){step(1)};
document.getElementById("goToday").onclick=function(){var d=new Date();state.y=d.getFullYear();state.m=d.getMonth();state.sel=todayStr();render()};
Array.prototype.forEach.call(document.querySelectorAll("#views button"),function(x){x.onclick=function(){state.view=x.dataset.v;render()}});

/* ============ 新增／補 PV ============ */
var dlg=document.getElementById("dlg"),form=document.getElementById("form");
document.getElementById("addBtn").onclick=function(){form.reset();if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","")};
document.getElementById("cancel").onclick=function(){dlg.close?dlg.close():dlg.removeAttribute("open")};
document.getElementById("save").onclick=function(e){
  e.preventDefault();
  if(!form.reportValidity())return;
  var f=new FormData(form);var o={name:f.get("name"),kind:f.get("kind"),chars:f.get("chars")||"",rerun:!!f.get("rerun"),
    start:f.get("start"),end:f.get("end"),pv:f.get("pv")||null,pvTime:f.get("pvTime")||null,pred:!!f.get("pred")};
  if(o.end<o.start){alert("截止日不能早於開池日");return}
  o.id="x-"+Date.now();var a=extras();a.push(o);saveExtras(a);
  dlg.close?dlg.close():dlg.removeAttribute("open");render();
};
document.getElementById("exportBtn").onclick=function(){
  var blob=new Blob([JSON.stringify({updated:T,pools:extras()},null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my_pools.json";a.click();
};

/* ============ 載入資料（線上 JSON 優先，失敗用內建） ============ */
function load(){
  if(!window.fetch||location.protocol==="file:"){state.source="內建資料（以檔案方式開啟，無法自動更新；放到網站或 SharePoint 後會抓 pools.json）";render();return}
  fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(j){if(!j||!Array.isArray(j.pools))throw new Error("format");
    state.base=j.pools;state.updated=j.updated||"未標示";state.source="線上 "+DATA_URL;render()})
  .catch(function(err){state.source=state.source.replace(/（.*$/,"")+"（自動讀取 "+DATA_URL+" 失敗："+((err&&err.message)||err)+"。可按「選取 pools.json」手動更新）";render()});
}
document.getElementById("reload").onclick=load;
document.getElementById("pick").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!j||!Array.isArray(j.pools))throw new Error("格式不符");
    state.base=j.pools;state.updated=j.updated||"未標示";state.source="手動選取的 "+f.name+"（存在這個瀏覽器）";
    try{localStorage.setItem(BASE_KEY,JSON.stringify(j))}catch(e){}render()}catch(e){alert("讀取失敗："+e.message)}};
  r.readAsText(f,"utf-8");this.value="";
};
load();
setInterval(load,REFRESH_MS);

/* ============ 跟著系統日期：跨日自動更新 ============ */
setInterval(function(){if(todayStr()!==T){var d=new Date();if(state.sel===T)state.sel=todayStr();state.y=d.getFullYear();state.m=d.getMonth();render()}},60*1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&todayStr()!==T)render()});
})();
</script>
</body>
